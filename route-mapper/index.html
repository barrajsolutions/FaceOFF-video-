<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a73e8">
<title>Route Mapper</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Route Mapper">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
:root{--blue:#1a73e8;--fg:#202124;--muted:#5f6368;--line:#dadce0;--chip:#f1f3f4;--bg:#fff;--red:#d93025}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.4 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--fg);background:var(--bg);-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
#app{display:flex;height:100%;height:100dvh}
#side{width:390px;max-width:100%;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fff;z-index:2}
#mapwrap{flex:1;position:relative;min-width:0}#map{position:absolute;inset:0}
header{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}.brand h1{font-size:17px;margin:0;flex:1}
.logo{width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;color:var(--blue);font-weight:500;font-size:13px}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn:disabled{opacity:.5}
.rname{font-size:13px;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.kpi{background:var(--chip);border-radius:10px;padding:6px 8px}.kpi b{display:block;font-size:17px}.kpi span{font-size:11px;color:var(--muted)}
#search{width:100%;margin-top:8px;padding:9px 14px;border:1px solid var(--line);border-radius:22px;font-size:16px;outline:none}
#search:focus{border-color:var(--blue);box-shadow:0 1px 4px rgba(26,115,232,.25)}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:10px 4px;border:0;background:none;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.pane{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.pane[hidden]{display:none}
.zones{padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
.zones label{display:flex;align-items:center;gap:5px;font-size:12px;background:var(--chip);padding:4px 9px;border-radius:999px;cursor:pointer}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.opts{padding:6px 14px;font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.item{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid #f1f3f4;cursor:pointer}.item:hover{background:#f8f9fa}
.item .n{min-width:54px;text-align:center;font-weight:700;border-radius:8px;color:#fff;padding:3px 4px;font-size:12px;height:fit-content}
.item .a{font-weight:500}.item .m{font-size:12px;color:var(--muted)}
.flag{color:var(--red);font-weight:500}
.sec{padding:12px 14px}.sec h3{font-size:14px;margin:14px 0 6px}
.sec table{width:100%;border-collapse:collapse;font-size:12.5px}.sec td,.sec th{padding:4px 6px;border-bottom:1px solid #f1f3f4;text-align:left;vertical-align:top}.sec td.r{text-align:right;white-space:nowrap}
.note{background:#e8f0fe;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.warn{background:#fce8e6;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.depot{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.depot label{font-weight:500;display:block;margin-bottom:6px}
.depot .row{display:flex;gap:6px}.depot input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:16px}
.dmsg{font-size:12.5px;color:var(--muted);margin-top:6px}.dmsg.ok{color:#188038}.dmsg.err{color:var(--red)}
#dline{margin-top:6px;font-size:12.5px;color:var(--fg);background:#f3e8fd;border-radius:10px;padding:5px 9px}
#dline b{color:#7627bb}#dline a{color:var(--blue);cursor:pointer;text-decoration:underline}
.wpin{background:#202124;color:#fff;border:2px solid #fff;border-radius:8px;padding:2px 7px;font-weight:700;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.45);white-space:nowrap;cursor:pointer}
.dist td.r{font-variant-numeric:tabular-nums}.dist tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.exports{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
/* markers */
.pin{border-radius:12px;color:#fff;font-weight:700;font-size:11.5px;line-height:17px;padding:1px 6px;white-space:nowrap;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.pin.multi{border-color:#202124}.pin.flagged{outline:2px dashed var(--red);outline-offset:1px}
.pin.first{box-shadow:0 0 0 4px #34a853,0 1px 4px rgba(0,0,0,.4)}.pin.last{box-shadow:0 0 0 4px #ea4335,0 1px 4px rgba(0,0,0,.4)}
.maplibregl-popup-content{border-radius:12px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.pop{font-size:13px;max-width:290px}.pop h4{margin:0 0 2px;font-size:15px}.pop table{border-collapse:collapse;width:100%;margin-top:6px;font-size:12px}.pop td{border-top:1px solid #eee;padding:3px 4px}
.pop .links a{display:inline-block;margin:8px 10px 0 0;color:var(--blue);font-weight:500;text-decoration:none}
.mapbtns{position:absolute;right:10px;bottom:30px;display:flex;flex-direction:column;gap:8px;z-index:1}
.mapbtns button{background:#fff;border:0;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);padding:8px 10px;font-size:12px;font-weight:500;color:var(--fg)}
.mapbtns button.on{color:var(--blue)}
#placing{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;padding:8px 14px;border-radius:18px;z-index:3;font-size:13px;display:none}
/* start / progress overlay */
#start{position:fixed;inset:0;background:#f8f9fa;z-index:10;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px rgba(60,64,67,.15);width:100%;max-width:560px;padding:22px}
.card h2{margin:0 0 6px;font-size:22px}.card p{color:var(--muted);margin:6px 0 14px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer}.drop.over{border-color:var(--blue);background:#e8f0fe}
.drop b{color:var(--blue)}
#routes{margin-top:12px;max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
#routes .r{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f1f3f4;cursor:pointer}#routes .r:hover{background:#f8f9fa}
#routes .r span{color:var(--muted);font-size:12.5px}
#rfilter{width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:22px;font-size:16px;margin-top:12px}
.bar{height:6px;background:#e8eaed;border-radius:3px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
#plog{font-size:12.5px;color:var(--muted)}
#toggle{display:none}
.grab{display:none}
#mapwrap{min-height:0}
#startBack{margin-right:2px}
@media (max-width:760px){
 #app{flex-direction:column-reverse}
 #side{width:100%;height:52%;border-right:0;border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(0,0,0,.12);border-radius:14px 14px 0 0;transition:height .25s ease}
 #side.min{height:auto}#side.min .tabs,#side.min .pane,#side.min .zones,#side.min .opts,#side.min .kpis,#side.min #search{display:none}
 #side.full{height:100%;border-radius:0;border-top:0;padding-top:env(safe-area-inset-top,0px)}
 #side.full .zones,#side.full .opts{display:none}
 .grab{display:block;width:44px;height:5px;border-radius:3px;background:#c4c7cc;margin:0 auto 8px;cursor:pointer}
 header{touch-action:none}
 #toggle{display:inline-block}
 header{padding:8px 12px 6px}.brand h1{font-size:16px}.rname{display:none}
 .btn{padding:5px 10px;font-size:12.5px}
 .kpis{margin-top:6px;gap:4px}.kpi{padding:3px 6px}.kpi b{font-size:15px}.kpi span{font-size:10.5px}
 #search{margin-top:6px;padding:7px 12px}
 .tabs button{padding:8px 4px}
 .zones{flex-wrap:nowrap;overflow-x:auto;padding:6px 12px;-webkit-overflow-scrolling:touch}.zones label{white-space:nowrap;font-size:11.5px}
 .opts{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding:5px 12px}
 .item,.sec,.exports{padding-left:12px;padding-right:12px}
 .mapbtns{top:10px;left:10px;right:auto;bottom:auto;flex-direction:row}
 .maplibregl-ctrl-attrib.maplibregl-compact{font-size:10px}
}
</style>

<body>
<div id="start">
 <div class="card">
  <div class="brand"><button class="btn" id="startBack" type="button" hidden>‹ Back</button><div class="logo">R</div><h2>Route Mapper</h2></div>
  <p>Load an Intelcom driver manifest (PDF), choose a route, and get the delivery map: stops grouped, official Québec addresses, driving route and analysis.</p>
  <label class="drop" id="drop"><input type="file" id="file" accept="application/pdf,.pdf" hidden>
   <div style="font-size:30px">📄</div><div><b>Choose manifest PDF</b> or drop it here</div><div style="font-size:12px;color:#5f6368;margin-top:4px">The PDF is read on this device only</div></label>
  <div id="pick" hidden>
   <div style="font-weight:500;margin-top:16px">Choose the route to map</div><input id="rfilter" type="search" placeholder="Search route (e.g. BELO1200)">
   <div id="routes"></div>
  </div>
  <div id="prog" hidden><div id="ptitle" style="font-weight:500;margin-top:14px"></div><div class="bar"><i id="pbar"></i></div><div id="plog"></div></div>
  <div id="resume" hidden style="margin-top:14px"></div>
  <div id="depotStart"></div>
 </div>
</div>
<div id="app">
 <aside id="side">
  <header>
   <div class="grab" id="grab" title="Drag up for the full list"></div>
   <div class="brand"><button class="btn" id="backbtn" type="button">‹ Routes</button><h1><span id="rn"></span></h1><button class="btn pri" id="toggle" type="button">Hide</button></div>
   <div class="rname" id="rsub"></div>
   <div class="kpis"><div class="kpi"><b id="k1"></b><span>packages</span></div><div class="kpi"><b id="k2"></b><span>stops</span></div><div class="kpi"><b id="k4"></b><span>route km</span></div><div class="kpi"><b id="k5"></b><span>total km</span></div></div>
   <div id="dline"></div>
   <input id="search" type="search" placeholder="Search address, seq # or tracking" autocomplete="off">
  </header>
  <div class="tabs"><button class="on" data-t="list">Stops</button><button data-t="analysis">Analysis</button><button data-t="issues">Issues <span id="icount"></span></button></div>
  <div class="zones" id="zones"></div>
  <div class="opts"><label><input type="checkbox" id="optDrive" checked> Driving route</label><label><input type="checkbox" id="optArrows" checked> Arrows</label><label><input type="checkbox" id="optLine"> Straight-line order</label></div>
  <div class="pane" id="list"></div>
  <div class="pane" id="analysis" hidden><div class="exports"><button class="btn" id="exStops">Stops CSV</button><button class="btn" id="exPk">Packages CSV</button><button class="btn" id="exKml">Google My Maps (KML)</button></div><div class="sec" id="anDepot" style="padding-bottom:0"></div><div class="sec" id="anbody"></div></div>
  <div class="pane sec" id="issues" hidden></div>
 </aside>
 <div id="mapwrap"><div id="map"></div>
  <div id="placing">Tap the map where this address is</div>
  <div class="mapbtns"><button id="bSat">Satellite</button><button id="bFit">Whole route</button><button id="bLoc">📍 Me</button></div>
 </div>
</div>
<script>
/*CORE-START*/
// ---------- Manifest parsing (Intelcom driver manifest) ----------
const COL = { codeMax: 125, trackMax: 245, seqMax: 278, addrMax: 578 };
async function parseManifest(pdfjs, doc, onProgress) {
  const routes = new Map();
  let lastRoute = null;
  for (let pn = 1; pn <= doc.numPages; pn++) {
    const page = await doc.getPage(pn);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    const items = [];
    for (const it of tc.items) {
      const s = (it.str || '').trim();
      if (!s) continue;
      const t = pdfjs.Util.transform(vp.transform, it.transform);
      items.push({ x: t[4], y: t[5], s });
    }
    page.cleanup && page.cleanup();
    const HDR = /^(Code|Tracking ID|Seq|Address|Dimensions|Signature|Intelcom .*|From \d{4}-.*|Route\s*-.*|Total number of packages.*)$/i;
    const heads = [];
    for (const it of items) {
      const m = it.s.match(/^Route\s*-\s*(.+)$/);
      if (m) {
        let name = m[1].trim();
        const lab = items.find(j => j !== it && j.y < it.y - 1 && j.y > it.y - 16 && j.x < 300 && !/^(Intelcom|From \d)/.test(j.s));
        if (lab && lab.s.trim() !== name) name = `${name} (${lab.s.trim()})`;
        heads.push({ y: it.y, name, total: null });
      }
    }
    heads.sort((a, b) => a.y - b.y);
    for (const it of items) {
      const m = it.s.match(/Total number of packages\s*:\s*(\d+)/i);
      if (m) { let h = null; for (const c of heads) if (c.y <= it.y + 4) h = c; if (h) h.total = +m[1]; }
    }
    const routeAt = y => { let h = null; for (const c of heads) if (c.y <= y + 1) h = c; return h ? h.name : lastRoute; };
    const getR = name => {
      if (!routes.has(name)) routes.set(name, { name, total: null, pages: [], records: [] });
      const R = routes.get(name); if (!R.pages.includes(pn)) R.pages.push(pn); return R;
    };
    heads.forEach(h => { const R = getR(h.name); if (R.total == null && h.total != null) R.total = h.total; });
    const body = items.filter(i => !HDR.test(i.s) && !(heads.length && i.y < heads[0].y && !lastRoute)).sort((a, b) => a.y - b.y || a.x - b.x);
    const isCode = i => i.x < COL.codeMax && /^[A-Z]{0,5}\d{6,}$/.test(i.s.split(/\s+/)[0]);
    const starts = body.filter(isCode);
    const recs = starts.map(s => ({ y: s.y, route: routeAt(s.y), code: s.s.split(/\s+/)[0], track: [], seq: [], addr: [] }));
    for (const it of body) {
      if (starts.includes(it)) continue;
      let r = null;
      for (const c of recs) if (c.y <= it.y + 3) r = c;
      if (!r) continue;
      if (heads.some(h => h.y > r.y && h.y <= it.y + 1)) continue; // belongs to a later section header
      if (it.x < COL.codeMax) continue;
      else if (it.x < COL.trackMax) r.track.push(it);
      else if (it.x < COL.seqMax) r.seq.push(it);
      else if (it.x < COL.addrMax) r.addr.push(it);
    }
    if (heads.length) lastRoute = heads[heads.length - 1].name;
    for (const r of recs) {
      const seq = parseInt(r.seq.map(i => i.s).join(''), 10);
      const address = r.addr.map(i => i.s).join(' ').replace(/\s+/g, ' ').trim();
      if (!r.route) continue;
      getR(r.route).records.push({ code: r.code, tracking: r.track.map(i => i.s).join(''), seq: isNaN(seq) ? null : seq, address, page: pn });
    }
    if (onProgress && (pn % 10 === 0 || pn === doc.numPages)) onProgress(pn, doc.numPages);
  }
  return [...routes.values()];
}

// ---------- Address normalisation ----------
const SYN = { st: 'saint', ste: 'sainte', street: 'rue', str: 'rue', av: 'avenue', ave: 'avenue', boul: 'boulevard', blvd: 'boulevard', bd: 'boulevard',
  ch: 'chemin', rte: 'route', '1re': '1', '1ere': '1', premiere: '1', ere: '1', '1er': '1', premier: '1', '2e': '2', '2eme': '2', deuxieme: '2',
  '3e': '3', '3eme': '3', troisieme: '3', '4e': '4', '5e': '5', mont: 'mont', n: 'nord', s: 'sud', o: 'ouest', e: 'est' };
const TYPES = new Set(['rue', 'avenue', 'boulevard', 'chemin', 'rang', 'route', 'place', 'montee', 'croissant', 'terrasse', 'impasse', 'allee', 'cote',
  'carre', 'promenade', 'circle', 'crescent', 'road', 'drive', 'court', 'rd', 'way', 'lane', 'cercle', 'sentier', 'ruelle', 'voie']);
const STOPW = new Set(['de', 'la', 'du', 'des', 'd', 'l', 'le', 'les', 'of', 'the']);
const FILLER = new Set(['unit', 'unite', 'apt', 'app', 'appt', 'appartement', 'suite', 'maison', 'house', 'bureau', 'local', 'porte', 'no', 'num']);
const RURAL = new Set(['rang', 'chemin', 'route', 'montee']);
function strip(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function toks(s) {
  return strip(String(s)).toLowerCase().replace(/[’'`\-#.,/]/g, ' ').split(/\s+/).filter(Boolean).map(t => SYN[t] || t);
}
function lev1(a, b) { // edit distance <= 1
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, d = 0;
  while (i < a.length && j < b.length) { if (a[i] === b[j]) { i++; j++; continue; } if (++d > 1) return false; if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; } }
  return d + (a.length - i) + (b.length - j) <= 1;
}
function near(a, b) { return a === b || (a.length >= 5 && b.length >= 5 && lev1(a, b)) || a + 's' === b || b + 's' === a; }
function hasNear(arr, t) { for (const x of arr) if (near(x, t)) return true; return false; }
function coreToks(street) { return toks(street).filter(t => !TYPES.has(t) && !STOPW.has(t)); }
function typeToks(street) { return toks(street).filter(t => TYPES.has(t)); }
function splitAddress(raw) {
  let a = raw.replace(/^CA[\d.]+\s+/, '').trim();
  const m = a.match(/^(.*?)\s+(QC|Qc|QUEBEC|Québec)\s+([A-Za-z]\d[A-Za-z])\s?(\d[A-Za-z]\d)\b/);
  if (!m) return { body: a.replace(/\s+CA$/, ''), muni: '', postal: '' };
  const pre = m[1].trim(); const parts = pre.split(/\s+/);
  const muni = parts.length > 1 ? parts.pop() : '';
  return { body: parts.join(' '), muni, postal: (m[3] + m[4]).toUpperCase() };
}
function parseNom(nom) {
  // "3665 rue Hamel, Saint-Jean-Baptiste J0L2B0"  or "3331 B rue des Cyprès, ..."
  const m = nom.match(/^(\d+)(?:\s+([A-Z]))?\s+(.*?),\s*(.*?)\s+([A-Z]\d[A-Z]\d[A-Z]\d)$/);
  if (!m) return null;
  let street = m[3], aqUnit = '';
  const u = street.match(/^(\d+[A-Z]?)\s+(.+)$/); // "3425 1 boulevard Laurier" = unit 1
  if (u && TYPES.has(toks(u[2])[0])) { aqUnit = u[1]; street = u[2]; }
  return { civic: m[1], suffix: m[2] || '', street, muni: m[4], postal: m[5], aqUnit };
}
function titleStreet(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ---------- Geocoding (Adresses Québec, then OpenStreetMap fallback) ----------
const AQ_URL = 'https://geoegl.msp.gouv.qc.ca/apis/icherche/geocode';
async function getJSON(url, tries = 3) {
  let err;
  for (let i = 0; i < tries; i++) {
    try { const r = await fetch(url); if (r.status === 429) throw new Error('429'); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    catch (e) { err = e; await new Promise(res => setTimeout(res, 800 * (i + 1) + (String(e).includes('429') ? 2500 : 0))); }
  }
  throw err;
}
async function aq(q, limit = 10) {
  const u = AQ_URL + '?' + new URLSearchParams({ q, type: 'adresses', limit, geometry: 'true' });
  const d = await getJSON(u);
  return (d.features || []).map(f => ({ nom: f.properties.nom, units: f.properties.nbUnite, lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], p: parseNom(f.properties.nom) })).filter(c => c.p);
}
function scoreCand(c, ctx) {
  const p = c.p;
  if (ctx.postal ? p.postal !== ctx.postal : toks(p.muni).join(' ') !== toks(ctx.muni).join(' ')) return -1;
  if (!ctx.nums.includes(p.civic)) return -1;
  const core = coreToks(p.street);
  const has = t => ctx.set.has(t) || hasNear(ctx.set, t);
  if (!core.length || !core.every(has)) return -1;
  let s = 10;
  const ty = typeToks(p.street);
  if (ty.length && ty.every(t => ctx.set.has(t))) s += 3;
  if (p.civic === ctx.nums[0]) s += 2;
  if (toks(p.muni).join(' ') === toks(ctx.muni).join(' ')) s += 1;
  if (p.suffix) s -= ctx.set.has(p.suffix.toLowerCase()) ? 0 : 2;

  store.set('rm_last', STATE);
  refreshDistances(); drawDepot();
}
function distTable() {
  const leg = STATE.depotLeg && depotLegValid() ? STATE.depotLeg : null, route = STATE.drive ? STATE.drive.km : null;
  const first = STATE.stops.find(s => s.stop === STATE.path[0]), last = STATE.stops.find(s => s.stop === STATE.path[STATE.path.length - 1]);
  const f = v => v == null ? '–' : v.toFixed(1) + ' km';
  return `<table class="dist"><tr><td>Warehouse → first stop<br><span style="color:#5f6368;font-size:12px">${leg ? esc(leg.depot.label) : 'warehouse not set'} → ${first ? esc(first.address) : ''}</span></td><td class="r">${f(leg && leg.km)}</td></tr>
  <tr><td>Route: first stop → last stop<br><span style="color:#5f6368;font-size:12px">${first ? esc(first.address) : ''} → ${last ? esc(last.address) : ''}</span></td><td class="r">${f(route)}</td></tr>
  <tr class="tot"><td>Total</td><td class="r">${leg && route != null ? f(leg.km + route) : '–'}</td></tr></table>`;
}
function refreshDistances() {
  if (!STATE) return;
  const leg = STATE.depotLeg && depotLegValid() ? STATE.depotLeg : null, route = STATE.drive ? STATE.drive.km : null;
  $('k4').textContent = route != null ? route.toFixed(1) : '–';
  $('k5').textContent = leg && route != null ? (leg.km + route).toFixed(1) : '–';
  $('dline').innerHTML = leg ? `Warehouse → 1st stop: <b>${leg.km.toFixed(1)} km</b> · Route: <b>${route != null ? route.toFixed(1) : '–'} km</b> · Total: <b>${route != null ? (leg.km + route).toFixed(1) : '–'} km</b>`
    : DEPOT ? 'Calculating the trip from the warehouse…' : `Add your warehouse to count the trip to the first stop. <a id="dset">Set warehouse</a>`;
  const ds = $('dset'); if (ds) ds.onclick = () => { document.querySelector('.tabs button[data-t=analysis]').click(); if (phone()) openFull(); setTimeout(() => $('depotIn2') && $('depotIn2').focus(), 300); };
  if (STATE.analysis) renderAnalysis(STATE.analysis);
}
function drawDepot() {
  if (!map) return;
  const leg = STATE.depotLeg && depotLegValid() ? STATE.depotLeg : null;
  if (depotMarker) { depotMarker.remove(); depotMarker = null; }
  if (!leg) { if (map.getLayer && map.getLayer('depot-line')) map.setLayoutProperty('depot-line', 'visibility', 'none'); return; }
  const el = document.createElement('div'); el.className = 'wpin'; el.textContent = isDefaultDepot() ? 'Intelcom Candiac' : 'Warehouse';
  depotMarker = new maplibregl.Marker({ element: el }).setLngLat([leg.depot.lon, leg.depot.lat])
    .setPopup(new maplibregl.Popup({ offset: 14 }).setHTML(`<div class="pop"><h4>Warehouse</h4><div>${esc(leg.depot.label)}</div><div style="margin-top:5px">To the first stop: <b>${leg.km.toFixed(1)} km</b></div></div>`)).addTo(map);
  const draw = () => {
    const data = { type: 'Feature', geometry: { type: 'LineString', coordinates: leg.geom } };
    if (map.getSource('depot')) map.getSource('depot').setData(data);
    else {
      map.addSource('depot', { type: 'geojson', data });
      map.addLayer({ id: 'depot-line', type: 'line', source: 'depot', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#9334e6', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 3, 16, 7], 'line-dasharray': [2, 1.2], 'line-opacity': .9 } }, map.getLayer('drive-case') ? 'drive-case' : undefined);
    }
    map.setLayoutProperty('depot-line', 'visibility', 'visible');
  };
  if (map.isStyleLoaded() && map.getSource('sat')) draw(); else map.once('load', draw);
}
depotForm($('depotStart'), 'depotIn1');
// ---------- exports ----------
function download(name, text, type) { const b = new Blob([text], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
const csvq = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
$('exStops').onclick = () => download(`${STATE.name}_stops.csv`, '﻿' + [['Stop', 'Seq', 'Packages', 'Address', 'Municipality', 'Postal', 'Units', 'Area', 'Latitude', 'Longitude', 'Official register', 'Tracking', 'Verify']].concat(STATE.stops.map(s => [s.stop, s.label, s.packages.length, s.address, s.municipality, s.postal, s.units.join('; '), s.zone, s.lat.toFixed(7), s.lon.toFixed(7), s.official, s.packages.map(p => p.tracking).join('; '), s.flags.join(' | ')])).map(r => r.map(csvq).join(',')).join('\n'), 'text/csv');
$('exPk').onclick = () => { const rows = []; STATE.stops.forEach(s => s.packages.forEach(p => rows.push([p.seq, s.stop, p.tracking, p.code, p.manifest, s.address, p.unit, s.municipality, s.lat.toFixed(7), s.lon.toFixed(7)]))); STATE.unresolved.forEach(u => rows.push([u.seq, '', u.tracking, u.code, u.address, 'NOT FOUND', '', '', '', ''])); rows.sort((a, b) => a[0] - b[0]); download(`${STATE.name}_packages.csv`, '﻿' + [['Seq', 'Stop', 'Tracking', 'Code', 'Manifest address', 'Address', 'Unit', 'Municipality', 'Latitude', 'Longitude']].concat(rows).map(r => r.map(csvq).join(',')).join('\n'), 'text/csv'); };
$('exKml').onclick = () => {
  const x = s => String(s ?? '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
  const abgr = h => 'ff' + h.slice(5, 7) + h.slice(3, 5) + h.slice(1, 3);
  const icon = 'https://www.gstatic.com/mapspro/images/stock/503-wht-blank_maps.png';
  let k = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${x(STATE.name)}</name>`;
  Object.entries(ZC).forEach(([z, c], i) => k += `<Style id="z${i}"><IconStyle><color>${abgr(c)}</color><Icon><href>${icon}</href></Icon></IconStyle></Style>`);
  k += `<Style id="rt"><LineStyle><color>ffe8731a</color><width>4</width></LineStyle></Style><Folder><name>Stops</name>`;
  const zi = Object.keys(ZC);
  STATE.stops.forEach(s => k += `<Placemark><name>${x(s.label)}</name><description><![CDATA[Stop #${s.stop} · ${s.packages.length} pkg<br>${x(s.address)}, ${x(s.municipality)}<br>${s.units.length ? 'Units: ' + x(s.units.join(', ')) + '<br>' : ''}${s.packages.map(p => 'Seq ' + p.seq + ': ' + x(p.tracking)).join('<br>')}${s.flags.length ? '<br>⚠ ' + x(s.flags.join(' | ')) : ''}]]></description><styleUrl>#z${zi.indexOf(s.zone)}</styleUrl><Point><coordinates>${s.lon},${s.lat},0</coordinates></Point></Placemark>`);
  k += `</Folder>`;
  if (STATE.depotLeg) { const d = STATE.depotLeg; k += `<Style id="wh"><LineStyle><color>ffbb2776</color><width>4</width></LineStyle></Style><Placemark><name>Warehouse</name><description>${x(d.depot.label)}</description><Point><coordinates>${d.depot.lon},${d.depot.lat},0</coordinates></Point></Placemark><Placemark><name>Warehouse to first stop ${d.km.toFixed(1)} km</name><styleUrl>#wh</styleUrl><LineString><tessellate>1</tessellate><coordinates>${d.geom.map(c => c[0] + ',' + c[1] + ',0').join(' ')}</coordinates></LineString></Placemark>`; }
  if (STATE.drive) k += `<Placemark><name>Driving route ${STATE.drive.km.toFixed(1)} km</name><styleUrl>#rt</styleUrl><LineString><tessellate>1</tessellate><coordinates>${STATE.drive.geom.map(c => c[0] + ',' + c[1] + ',0').join(' ')}</coordinates></LineString></Placemark>`;
  k += `</Document></kml>`;
  download(`${STATE.name}_mymaps.kml`, k, 'application/vnd.google-earth.kml+xml');
};
